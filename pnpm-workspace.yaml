packages:
  - "packages/*"
  - "apps/*"
  - "desktop-app"
virtualStoreDir: C:/ps-store/.pnpm
# The web app is React 18, but the mobile app (Expo 57) pulls in @types/react 19, whose ReactNode
# includes bigint. When both versions exist, react-router's types bind to 19 and clash with web's
# React 18, making every <Route>/<Link> fail `tsc -b`. A scoped override didn't hold on the server's
# hoisting, so pin @types/react to 18 for the ENTIRE workspace — there is then no 19 for anything to
# bind to. The web + api builds (the only ones built here / on the server) are React 18, so this is
# correct for them. The mobile app runs on React 19 at RUNTIME regardless (Metro/Babel don't
# typecheck); only its editor type-hints see 18. Revisit if mobile needs its own 19 types back.
overrides:
  "@types/react": "18.3.31"
  "@types/react-dom": "18.3.7"
packageExtensions:
  react-router-dom@6.30.4:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  react-router@6.30.4:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  electron: true
  esbuild: true
  prisma: true
  protobufjs: true
  # Its only install script is opencollective-postinstall, which prints a donation notice.
  # Nothing is compiled, so skipping it changes nothing about how OCR works.
  tesseract.js: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.6'
  - '@expo/config-plugins@57.0.3'
  - '@expo/config@57.0.3'
  - '@expo/fingerprint@0.20.3'
  - '@expo/inline-modules@0.1.2'
  - '@expo/prebuild-config@57.0.5'
  - '@expo/router-server@57.0.2'
  - babel-preset-expo@57.0.2
  - expo-modules-autolinking@57.0.5
  - expo-modules-core@57.0.3
  - expo-modules-jsi@57.0.1
  - expo@57.0.4
  - expo-image-picker@57.0.5
  - expo-sharing@57.0.6
  - expo-location@57.0.5
