packages:
  - "packages/*"
  - "apps/*"
  - "desktop-app"
virtualStoreDir: C:/ps-store/.pnpm
# The mobile app pulls in @types/react 19 (Expo 57 / React 19), but the web app is React 18. Without
# this, react-router's types get bound to the hoisted @types/react 19 (whose ReactNode includes
# bigint), which clashes with web's React 18 and makes every <Route>/<Link> fail `tsc -b`. Force
# react-router (a web-only dependency — mobile uses react-navigation) onto @types/react 18. Mobile's
# own React 19 types are untouched.
overrides:
  "react-router>@types/react": "^18.3.5"
  "react-router-dom>@types/react": "^18.3.5"
packageExtensions:
  react-router-dom@6.30.4:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  react-router@6.30.4:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  electron: true
  esbuild: true
  prisma: true
  protobufjs: true
  # Its only install script is opencollective-postinstall, which prints a donation notice.
  # Nothing is compiled, so skipping it changes nothing about how OCR works.
  tesseract.js: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.6'
  - '@expo/config-plugins@57.0.3'
  - '@expo/config@57.0.3'
  - '@expo/fingerprint@0.20.3'
  - '@expo/inline-modules@0.1.2'
  - '@expo/prebuild-config@57.0.5'
  - '@expo/router-server@57.0.2'
  - babel-preset-expo@57.0.2
  - expo-modules-autolinking@57.0.5
  - expo-modules-core@57.0.3
  - expo-modules-jsi@57.0.1
  - expo@57.0.4
  - expo-image-picker@57.0.5
  - expo-sharing@57.0.6
  - expo-location@57.0.5
